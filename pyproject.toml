[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxio-mcp"
version = "0.1.0"
description = "信息获取 MCP Server：RSS 订阅解析 + 网页正文提取，让 Claude/Cursor 等 LLM 客户端直接读取任意信息源"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "IYABAO", email = "iyabao@vip.qq.com" }]
keywords = ["mcp", "fastmcp", "rss", "web", "llm", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio"]

[project.scripts]
fluxio-mcp = "fluxio_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: 真实网络端到端测试（可能被反爬/网络环境影响）",
]
